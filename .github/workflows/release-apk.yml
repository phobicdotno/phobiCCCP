name: release-apk

# Builds the pad app's release APK and publishes it as a GitHub release, so it
# can be downloaded on a tablet. Runs on a pushed version tag (v1.2.3), or by
# hand from the Actions tab, which releases the version in VERSION from main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release itself, empty: the two APK jobs below add their file to it,
  # each on its own, so one failing does not hold back the other.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          # The Android version code is major*10000 + minor*100 + patch
          # (CMakeLists.txt): minor or patch 100 or more would collide with
          # another version's code. Nothing is released for such a version.
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$v' is not major.minor.patch"; exit 1
          fi
          IFS=. read -r ma mi pa <<< "$v"
          if (( 10#$mi >= 100 || 10#$pa >= 100 )); then
            echo "::error::version $v: minor and patch must be below 100 (Android version code)"; exit 1
          fi
          echo "V=$v" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
          gh release create "v$V" --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "phobiCCCP $V" \
            --notes "PhobiCCCP for pads: download an .apk on the tablet and open it to install (allow installing from your browser if Android asks). PhobiCCCP-desktop-$V.apk is the desktop program itself on the pad; PhobiCCCP-$V.apk is the older, smaller pad app. Both are the same app to Android: installing one replaces the other, either way round, and keeps its designs. A newer version always installs over an older one; an older one cannot go over a newer one."

  apk:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat ../VERSION)"; fi
          echo "V=$v" >> "$GITHUB_ENV"
          # The same Android version code as the desktop program's APK
          # (CMakeLists.txt: major*10000 + minor*100 + patch), so the two
          # can replace each other either way round.
          # As checked in the release job (10#: 1.3.08 is not octal).
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$v' is not major.minor.patch"; exit 1
          fi
          IFS=. read -r ma mi pa <<< "$v"
          if (( 10#$mi >= 100 || 10#$pa >= 100 )); then
            echo "::error::version $v: minor and patch must be below 100 (Android version code)"; exit 1
          fi
          echo "CODE=$((10#$ma * 10000 + 10#$mi * 100 + 10#$pa))" >> "$GITHUB_ENV"

      - name: Release signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # One fixed key for every release, so a pad can update in place and keep its
          # data. Without the secrets the build would sign with a throwaway debug key and
          # no pad could install it over the last one: fail instead.
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS secrets are not set"; exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KS_PASS" "$KS_ALIAS" "$KS_PASS" > android/key.properties

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --build-name "$V" --build-number "$CODE"
          cp build/app/outputs/flutter-apk/app-release.apk "PhobiCCCP-$V.apk"

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$V" "PhobiCCCP-$V.apk" --repo "$GITHUB_REPOSITORY" --clobber

  # The desktop program built for the pad (Qt), added to the same release as
  # PhobiCCCP-desktop-<version>.apk. Same app id, key and version code as the
  # pad app above, so installing it replaces that one, and either can go back
  # over the other.
  desktop-apk:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "V=$v" >> "$GITHUB_ENV"

      # aqtinstall directly: install-qt-action cannot resolve Qt 6.8 for Android.
      - name: Qt for Android
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install -q aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/qt"
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux android 6.8.3 android_arm64_v8a -O "$RUNNER_TEMP/qt" -m qtserialport
          echo "QT_ROOT_DIR=$RUNNER_TEMP/qt/6.8.3/android_arm64_v8a" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/qt/6.8.3/gcc_64" >> "$GITHUB_ENV"

      - name: Android SDK parts
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build libboost-dev   # Boost.Polygon (true V-carve): headers only
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          cmake --build build-android --parallel

      - name: Sign with the release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS secrets are not set"; exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          bt="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          "$bt/zipalign" -f -p 4 build-android/android-build/build/outputs/apk/release/android-build-release-unsigned.apk aligned.apk
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "PhobiCCCP-desktop-$V.apk" aligned.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$V" "PhobiCCCP-desktop-$V.apk" --repo "$GITHUB_REPOSITORY" --clobber

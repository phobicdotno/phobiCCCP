name: release-apk

# Builds the pad app's release APK and publishes it as a GitHub release, so it
# can be downloaded on a tablet. Runs on a pushed version tag (v1.2.3), or by
# hand from the Actions tab, which releases the version in VERSION from main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat ../VERSION)"; fi
          echo "V=$v" >> "$GITHUB_ENV"

      - name: Release signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # One fixed key for every release, so a pad can update in place and keep its
          # data. Without the secrets the build would sign with a throwaway debug key and
          # no pad could install it over the last one: fail instead.
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS secrets are not set"; exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KS_PASS" "$KS_ALIAS" "$KS_PASS" > android/key.properties

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "PhobiCCCP-$V.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" "PhobiCCCP-$V.apk" --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "phobiCCCP $V" \
            --notes "PhobiCCCP for pads: download the .apk on the tablet and open it to install. It is signed with a test key, so Android may ask you to allow the install."

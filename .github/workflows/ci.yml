name: CI

# Build and run the whole ctest suite on every push and pull request, the same
# way README's "Building" section does it by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commits must be authored and committed by a person. Reject anything signed
  # as Claude / anthropic.com or carrying a Claude co-author or session trailer.
  commit-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject Claude-authored commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..HEAD"
          else
            range="HEAD --not origin/main"
          fi
          bad=0
          for c in $(git rev-list $range); do
            who=$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$c")
            body=$(git log -1 --format='%B' "$c")
            if echo "$who" | grep -qiE '^claude <|@anthropic\.com>' ||
               echo "$body" | grep -qiE '^co-authored-by:.*(claude|anthropic)|^claude-session:|claude\.ai/code|generated with \[?claude'; then
              echo "::error::$(git log -1 --format='%h %an <%ae>: %s' "$c")"
              bad=1
            fi
          done
          exit $bad

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The canvas, panel and export suites create real widgets; there is no
      # display on the runner.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            libqt6sql6-sqlite qt6-serialport-dev zlib1g-dev libgl1-mesa-dev \
            libboost-dev python3

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # The grblsim / machine-flow suites are RUN_SERIAL in CMakeLists.txt, so
      # running the rest in parallel does not starve their wall-clock deadlines.
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4 --timeout 600

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

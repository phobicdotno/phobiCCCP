name: CI

# Build and run the whole ctest suite on every push and pull request, the same
# way README's "Building" section does it by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commits must be authored and committed by a person. Reject anything signed
  # by an AI assistant or carrying an assistant co-author or session trailer.
  commit-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject bot-authored commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..HEAD"
          else
            range="HEAD --not origin/main"
          fi
          bad=0
          for c in $(git rev-list $range); do
            who=$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$c")
            body=$(git log -1 --format='%B' "$c")
            if echo "$who" | grep -qiE '^cl[a]ude <|@anthr[o]pic\.com>' ||
               echo "$body" | grep -qiE '^co-authored-by:.*(cl[a]ude|anthr[o]pic)|^cl[a]ude-session:|cl[a]ude\.ai/code|generated with \[?cl[a]ude'; then
              echo "::error::$(git log -1 --format='%h %an <%ae>: %s' "$c")"
              bad=1
            fi
          done
          exit $bad

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The canvas, panel and export suites create real widgets; there is no
      # display on the runner.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            libqt6sql6-sqlite qt6-serialport-dev zlib1g-dev libgl1-mesa-dev \
            libboost-dev python3 ccache

      # Compiler cache: a run only recompiles the files its commit changed.
      # ccache keeps it in ~/.cache/ccache. Each run saves its own entry; a new
      # branch starts from main's.
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-main-

      - name: Configure
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build --parallel
          ccache --show-stats

      # The grblsim / machine-flow suites are RUN_SERIAL in CMakeLists.txt, so
      # running the rest in parallel does not starve their wall-clock deadlines.
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4 --timeout 600

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # The phone app (Android/): unit tests, then a debug APK to install from the run's artifacts.
  android:
    # The pad app (Flutter): analyze, unit tests, and a debug APK to install.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhobiCCCP-android
          path: Android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # The desktop program itself built for Android (the pad), as an APK to try
  # from the run's artifacts. Signed with a throwaway debug key.
  android-qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # aqtinstall directly: install-qt-action cannot resolve Qt 6.8 for Android.
      - name: Qt for Android
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install -q aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/qt"
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux android 6.8.3 android_arm64_v8a -O "$RUNNER_TEMP/qt" -m qtserialport
          echo "QT_ROOT_DIR=$RUNNER_TEMP/qt/6.8.3/android_arm64_v8a" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/qt/6.8.3/gcc_64" >> "$GITHUB_ENV"

      - name: Android SDK parts
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build libboost-dev   # Boost.Polygon: headers only
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125"

      - name: Build APK
        run: cmake --build build-android --parallel

      - name: Sign
        run: |
          bt="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$bt/zipalign" -f -p 4 build-android/android-build/build/outputs/apk/release/android-build-release-unsigned.apk aligned.apk
          "$bt/apksigner" sign --ks debug.keystore --ks-pass pass:android --out PhobiCCCP-desktop.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhobiCCCP-desktop-android
          path: PhobiCCCP-desktop.apk
          if-no-files-found: error

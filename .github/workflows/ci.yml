name: CI

# Build and run the whole ctest suite on every push and pull request, the same
# way README's "Building" section does it by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commits must be authored and committed by a person. Reject anything signed
  # by an AI assistant or carrying an assistant co-author or session trailer.
  commit-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject bot-authored commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..HEAD"
          else
            range="HEAD --not origin/main"
          fi
          bad=0
          for c in $(git rev-list $range); do
            who=$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$c")
            body=$(git log -1 --format='%B' "$c")
            if echo "$who" | grep -qiE '^cl[a]ude <|@anthr[o]pic\.com>' ||
               echo "$body" | grep -qiE '^co-authored-by:.*(cl[a]ude|anthr[o]pic)|^cl[a]ude-session:|cl[a]ude\.ai/code|generated with \[?cl[a]ude'; then
              echo "::error::$(git log -1 --format='%h %an <%ae>: %s' "$c")"
              bad=1
            fi
          done
          exit $bad

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The canvas, panel and export suites create real widgets; there is no
      # display on the runner.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            libqt6sql6-sqlite qt6-serialport-dev zlib1g-dev libgl1-mesa-dev \
            libboost-dev python3

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # The grblsim / machine-flow suites are RUN_SERIAL in CMakeLists.txt, so
      # running the rest in parallel does not starve their wall-clock deadlines.
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4 --timeout 600

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # The phone app (Android/): unit tests, then a debug APK to install from the run's artifacts.
  android:
    # The pad app (Flutter): analyze, unit tests, and a debug APK to install.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhobiCCCP-android
          path: Android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

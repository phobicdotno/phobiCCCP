<?xml version="1.0" encoding="UTF-8"?>
<!-- No width/height: user units are CSS px (96 dpi) -> 25.4 x 25.4 mm page.
     Relative path commands with an arc, a polygon and an open line. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <path d="m10,10 h20 a10,10 0 0 1 0,20 h-20 z"/>
  <polygon points="50,50 90,50 70,90"/>
  <line x1="0" y1="0" x2="10" y2="0"/>
  <image x="0" y="0" width="1" height="1" href="x.png"/>
</svg>
